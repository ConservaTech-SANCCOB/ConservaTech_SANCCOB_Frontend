name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - "volunteer-mobile-app/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "volunteer-mobile-app/**"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: volunteer-mobile-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: volunteer-mobile-app/package-lock.json

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npx jest --ci
