name: Web App CI/CD

# Runs only when the web-app (or this workflow) changes, so backend and
# mobile-app commits don't trigger it.
on:
  push:
    branches: [main]
    paths:
      - "web-app/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "web-app/**"
      - ".github/workflows/web-ci.yml"

# A newer push to the same branch cancels the older run still in progress.
concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Public value (NEXT_PUBLIC_*) - same URL as in .env.local, no /api, no trailing /
  NEXT_PUBLIC_API_URL: https://sanccob-backend-api-btgscudjhbcdddf8.spaincentral-01.azurewebsites.net

jobs:
  # ---------------------------------------------------------------------------
  # CI: lint, type-check, test and build. Runs on every push and pull request.
  # ubuntu-latest is case-sensitive, so it also catches the Windows-only
  # filename-casing import bugs.
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # --if-present: skipped (not failed) if the script isn't defined yet.
      - name: Lint
        run: npm run lint --if-present

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # CD: deploy to Vercel. Only on pushes to main, and only if CI passed.
  # Runs from the repo root on purpose: the Vercel project's Root Directory
  # setting (Frontend/web-app) handles the sub-folder.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Vercel
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
